<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #fcfcfa; color: #1c232b; }
  .card { display: grid; grid-template-columns: 1fr 400px; column-gap: 64px; align-items: center; height: 630px; padding: 0 80px; box-sizing: border-box; }
  h1 { font-family: "Literata", serif; font-weight: 500; font-size: 84px; line-height: 1; letter-spacing: -0.01em; margin: 0 0 22px; font-variation-settings: "opsz" 72; }
  .aff { font-family: "Schibsted Grotesk", sans-serif; font-size: 25px; line-height: 1.4; color: #5b6672; margin: 0 0 30px; }
  .blurb { font-family: "Literata", serif; font-size: 30px; line-height: 1.45; margin: 0 0 34px; }
  .url { font-family: "Schibsted Grotesk", sans-serif; font-weight: 500; font-size: 26px; color: #2a4a70; margin: 0; }
  img { width: 400px; height: 414px; object-fit: cover; border-radius: 8px; display: block; }
</style></head>
<body><div class="card">
  <div>
    <h1>Eike Düvel</h1>
    <p class="aff">Postdoctoral researcher, Institute of Philosophy and ITAS, Karlsruhe Institute of Technology</p>
    <p class="blurb">Ethics and political philosophy: the ethics of risk, climate justice, and AI and democracy.</p>
    <p class="url">eikeduevel.com</p>
  </div>
  <img src="../photo.jpg" alt="">
</div></body></html>
